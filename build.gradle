// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    ext.kotlin_version = "1.9.24"
    ext.safe_args_version = "2.7.7"
    ext.core_version = "1.12.0"
    ext.appcompat_version = "1.6.1"
    ext.constraintlayout_version = "2.1.4"
    ext.lifecycle_version = "2.6.2"
    ext.viewmodel_version = "2.6.2"
    ext.fragment_version = "1.6.2"
    ext.activity_version = "1.8.2"
    ext.navigation_version = "2.7.7"
    ext.material_version = "1.11.0"
    ext.ffmpeg_version = "v4.4.LTS"
    ext.bindingcollectionadapter_version = "4.0.0"
    ext.exoplayer_version = "2.19.1"
    ext.glide_version = "4.16.0"
    ext.hilt_version = "2.51.1"
    ext.preference_version = "1.2.1"
    ext.google_service_version = "4.4.1"
    ext.firebase_crashlytics_gradle_version = "2.9.9"
    ext.firebase_bom_version = "32.7.0"

    ext.junit_version = "4.13.2"
    ext.ext_junit_version = "1.1.5"
    ext.espresso_version = "3.5.1"

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$safe_args_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "com.google.gms:google-services:$google_service_version"
        classpath "com.google.firebase:firebase-crashlytics-gradle:$firebase_crashlytics_gradle_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
